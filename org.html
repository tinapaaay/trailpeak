<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer · TrailPeak</title>
<link rel="stylesheet" href="styles.css">
<style>
/* Organizer profile: who they are and what's verified, then their trips, then reviews. */
.profile { padding: var(--space-xl) 0 var(--space-xxl); display: grid; gap: var(--space-xl); grid-template-columns: minmax(0, 1fr); }
.profile > * { min-width: 0; }
.who { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-lg); align-items: center; }
.who .org-avatar { width: 96px; height: 96px; font-size: 28px; background: var(--color-neutral); }
.who h1 { font: 700 40px/1.1 var(--font-display); letter-spacing: -0.02em; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
.who p { color: var(--color-secondary); }
.stats-row { display: flex; flex-wrap: wrap; gap: var(--space-lg); margin-top: var(--space-sm); }
.stats-row div { display: grid; gap: 2px; }
.stats-row .value { font: 700 28px/1.1 var(--font-label); font-feature-settings: "tnum" 1; color: var(--color-on-surface); }
.stats-row .label-caps { color: var(--color-secondary); }

.checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }
.check-item { background: var(--color-card); border-radius: var(--rounded-lg); padding: var(--space-lg); display: grid; gap: var(--space-xs); align-content: start; }
.check-item svg { color: var(--color-primary); }
.check-item.no svg { color: var(--color-secondary); }
.check-item .tag-demo { justify-self: start; }
.check-item p { color: var(--color-secondary); font-size: 15px; line-height: 1.5; }
.section-title { font: 700 32px/1.15 var(--font-display); letter-spacing: -0.02em; margin-bottom: var(--space-md); }

.reviews { list-style: none; padding: 0; margin: 0; display: grid; }
.reviews li { padding: var(--space-md) 0; border-top: 1px solid var(--color-border); display: grid; gap: var(--space-xs); max-width: 68ch; }
.review-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
.stars { color: var(--color-primary); letter-spacing: 2px; }
.stars .off { color: var(--color-secondary); } /* outline stars, dark enough to see */
.missing { display: grid; gap: var(--space-sm); justify-items: start; padding: var(--space-xl) 0; }

@media (max-width: 1024px) { .checks { grid-template-columns: 1fr; } }
@media (max-width: 767px) {
  .who { grid-template-columns: 1fr; }
  .who .org-avatar { width: 72px; height: 72px; font-size: 22px; }
  .who h1 { font-size: 32px; }
  .section-title { font-size: 24px; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

</svg>
<header class="header">
  <div class="wrap">
    <a class="logo" href="index.html"><svg width="28" height="28"><use href="#i-mountain"/></svg>TrailPeak</a>
    <nav class="nav" aria-label="Main">
      <a href="index.html#day" data-kind="day">Day hikes</a>
      <a href="index.html#major" data-kind="major">Major climbs</a>
      <a href="organize.html">Post a trip</a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-secondary label-caps post-link" href="organize.html">Post a trip</a>
      <span class="avatar" role="img" aria-label="Your profile"><svg width="22" height="22"><use href="#i-user"/></svg></span>
    </div>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <div class="profile" id="profile"></div>
</main>

<footer class="footer">
  <div class="wrap">TrailPeak prototype · organizers, trips and reviews are sample data</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="trips.js"></script>
<script src="cards.js"></script>
<script>
const slugOf = name => name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = location.hash.slice(1);
const trips = TRIPS.filter(t => isListed(t) && slugOf(t.org) === slug);
const root = document.getElementById("profile");

if (!trips.length) {
  root.innerHTML = `<div class="missing"><h1 class="section-title">Organizer not found</h1><p class="meta">This organizer may have stopped posting trips.</p><a class="btn btn-primary label-caps" href="index.html">Find trips</a></div>`;
} else {
  const org = trips[0].org, verified = trips.some(t => t.verified);
  const business = trips.some(t => t.business === "verified") ? "verified" : trips.some(t => t.business === "review") ? "review" : "none";
  const runs = Math.max(...trips.map(t => t.orgTrips || 0));
  const reviews = trips.flatMap(t => (t.reviewList || []).map(r => [...r, t])).sort((a, b) => b[1].localeCompare(a[1]));
  const rated = trips.filter(t => t.reviews);
  const avg = rated.length ? rated.reduce((a, t) => a + t.rating * t.reviews, 0) / rated.reduce((a, t) => a + t.reviews, 0) : 0;
  const count = rated.reduce((a, t) => a + t.reviews, 0);
  const pickups = [...new Set(trips.flatMap(t => t.pickups.map(p => p.place)))];
  const mountains = [...new Set(trips.map(t => t.title))];
  const stars = n => `<span class="stars" aria-hidden="true">${"★".repeat(n)}<span class="off">${"☆".repeat(5 - n)}</span></span><span class="sr">${n} out of 5 stars</span>`;
  document.title = `${org} · TrailPeak`;

  // Cards: next open date per trip, with this browser's bookings taken off.
  const cards = trips.map(t => {
    const deps = Object.keys(t.departures).sort().filter(d => !isPastDate(d)).map(d => [d, slotsLeft(t, d)]).filter(([, l]) => l > 0);
    if (!deps.length) return "";
    const tour = { ...t, length: `${t.typeLabel} · ${t.hours}`, page: `trip.html#${t.id}`, pickups: t.pickups.map(p => p.place) };
    return card(tour, deps[0]);
  }).join("");

  root.innerHTML = `
    <section class="who" aria-labelledby="org-h">
      <span class="org-avatar label-caps" aria-hidden="true">${esc(initialsOf(org))}</span>
      <div>
        <h1 id="org-h">${esc(org)}</h1>
        ${verified ? `<p class="org-claim">${claimBadge("ID verified")}</p>` : ""}
        <p>Joiner trips to ${esc(mountains.join(", "))}. Pick-ups in ${esc(pickups.join(", "))}.</p>
        <div class="stats-row">
          <div><span class="value">${runs || "New"}</span><span class="label-caps">${runs ? "Trips run" : "On TrailPeak"}</span></div>
          <div><span class="value">${count ? avg.toFixed(1) : "—"}</span><span class="label-caps">${count ? `Average from ${count} reviews` : "No reviews yet"}</span></div>
          <div><span class="value">${trips.length}</span><span class="label-caps">${trips.length === 1 ? "Trip listed" : "Trips listed"}</span></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="checks-h">
      <h2 class="sr" id="checks-h">Verification</h2>
      <div class="checks">
        <div class="check-item${verified ? "" : " no"}">${icon(verified ? "tick" : "x", 24)}<strong>${verified ? "ID verified" : "ID not checked yet"}</strong>${verified ? `<span class="tag-demo">${DEMO_CHECK}</span>` : ""}<p>${verified ? "Marked as checked, but TrailPeak has no real ID-check service yet." : "Book with care: TrailPeak hasn't checked this organizer's ID."}</p></div>
        <div class="check-item${business === "verified" ? "" : " no"}">${icon(business === "verified" ? "tick" : business === "review" ? "clock" : "x", 24)}<strong>${business === "verified" ? "Business verified" : business === "review" ? "Business documents in review" : "Business not checked"}</strong>${business === "verified" ? `<span class="tag-demo">${DEMO_CHECK}</span>` : ""}<p>${business === "verified" ? "Marked as checked, but TrailPeak has no real business-document check yet." : business === "review" ? "The organizer sent business documents; they haven't been checked." : "No business documents have been reviewed."}</p></div>
        <div class="check-item">${icon("calendar", 24)}<strong>Standard cancellation policy</strong><p>Weather or closure: move or refund. Organizer cancels: full DP refund. Joiner cancels 7+ days before: move once.</p></div>
      </div>
    </section>

    <p class="meta id-limits">${ID_LIMITS}</p>

    <section aria-labelledby="trips-h">
      <h2 class="section-title" id="trips-h">Upcoming trips</h2>
      ${cards ? `<div class="grid">${cards}</div>` : `<p class="meta">No upcoming dates right now.</p>`}
    </section>

    <section aria-labelledby="reviews-h">
      <h2 class="section-title" id="reviews-h">Reviews</h2>
      ${reviews.length
        ? `<ul class="reviews">${reviews.map(([name, date, n, text, t]) => `<li><div class="review-top"><strong>${esc(name)}</strong>${stars(n)}<span class="meta">${new Date(date + "T00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })} · ${esc(t.title)}</span></div><p>${esc(text)}</p></li>`).join("")}</ul>`
        : `<p class="meta">No reviews yet. Joiners can review after their trip.</p>`}
    </section>`;
}
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
