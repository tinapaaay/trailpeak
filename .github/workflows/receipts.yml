name: Receipt regression tests
on:
  pull_request:
    paths:
      - 'api.js'
      - 'auth.js'
      - 'demo.html'
      - 'trip.html'
      - 'cards.js'
      - 'signin.html'
      - 'dashboard.html'
      - 'mytrips.html'
      - 'reserve.html'
      - 'supabase/schema.sql'
      - 'tests/**'
      - '.github/workflows/receipts.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    # A real, throwaway Postgres for the concurrency tests (tests/race.test.mjs); PGlite has one connection.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm test --prefix tests
