name: Receipt regression tests
on:
  pull_request:
    paths:
      - 'api.js'
      - 'demo.html'
      - 'trip.html'
      - 'cards.js'
      - 'signin.html'
      - 'dashboard.html'
      - 'mytrips.html'
      - 'reserve.html'
      - 'supabase/schema.sql'
      - 'tests/**'
      - '.github/workflows/receipts.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm test --prefix tests
