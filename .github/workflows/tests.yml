name: Tests
# Runs on every PR and on main, so branch protection can require it.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    # A real, throwaway Postgres for the concurrency tests (tests/race.test.mjs); PGlite has one connection.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm test --prefix tests
  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Lint DESIGN.md (0 errors, 0 warnings)
        run: |
          npx -y @google/design.md@0.4.0 lint --format json DESIGN.md > lint.json
          node -e "const s=require('./lint.json').summary; console.log(s); if (s.errors||s.warnings) process.exit(1)"
